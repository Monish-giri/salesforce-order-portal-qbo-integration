<template>
    <section class="returns-view">
        <div class="view-heading">
            <div>
                <p class="section-kicker">RETURN HISTORY</p>
                <h1>My Returns</h1>
                <p>Track return requests submitted from the portal and their processing status.</p>
            </div>
            <button class="refresh-button" type="button" onclick={refreshReturns} disabled={isLoading}>
                <lightning-icon icon-name="utility:refresh" size="x-small" alternative-text="Refresh"></lightning-icon>
                <span>Refresh</span>
            </button>
        </div>

        <template if:true={errorMessage}>
            <div class="message error" role="alert">{errorMessage}</div>
        </template>

        <template if:true={isLoading}>
            <div class="loading-state">
                <lightning-spinner alternative-text="Loading returns" size="small"></lightning-spinner>
                <span>Loading your return history...</span>
            </div>
        </template>

        <template if:true={hasReturns}>
            <div class="return-list">
                <template for:each={returns} for:item="returnRecord">
                    <article class="return-card" key={returnRecord.id}>
                        <div class="return-main">
                            <div class="return-icon">
                                <lightning-icon icon-name="utility:replace" size="small" alternative-text="Return"></lightning-icon>
                            </div>
                            <div class="return-copy">
                                <div class="return-title-row">
                                    <h2>{returnRecord.returnNumber}</h2>
                                    <span class={returnRecord.statusClass}>{returnRecord.status}</span>
                                </div>
                                <p class="return-order">Order #{returnRecord.orderNumber}</p>
                                <p class="return-reason">{returnRecord.reason}</p>
                            </div>
                        </div>

                        <div class="return-meta">
                            <div>
                                <span class="meta-label">Requested</span>
                                <span class="meta-value">{returnRecord.createdDate}</span>
                            </div>
                            <div>
                                <span class="meta-label">Resolution</span>
                                <span class="meta-value">{returnRecord.resolutionLabel}</span>
                            </div>
                            <div>
                                <span class="meta-label">Return amount</span>
                                <lightning-formatted-number
                                    class="meta-value"
                                    value={returnRecord.amountLabel}
                                    format-style="currency"
                                    currency-code="INR"
                                    maximum-fraction-digits="0">
                                </lightning-formatted-number>
                            </div>
                        </div>

                        <div class="return-footer">
                            <div class="return-step">
                                <span>Processing step</span>
                                <strong>{returnRecord.currentStep}</strong>
                            </div>
                            <button
                                class="details-button"
                                type="button"
                                data-id={returnRecord.id}
                                onclick={openReturn}>
                                View details
                            </button>
                        </div>
                    </article>
                </template>
            </div>
        </template>

        <template if:true={showEmpty}>
            <div class="empty-state">
                <div class="empty-icon">
                    <lightning-icon icon-name="utility:replace" size="medium" alternative-text="Returns"></lightning-icon>
                </div>
                <p class="section-kicker">NO RETURNS YET</p>
                <h2>Your return requests will appear here.</h2>
                <p>Submit a return from an order to track its approval and processing progress.</p>
            </div>
        </template>
    </section>

    <template if:true={showDetail}>
        <section class="detail-backdrop" role="presentation" onclick={closeDetail}>
            <div class="detail-modal" role="dialog" aria-modal="true" aria-label="Return details" onclick={stopPropagation}>
                <div class="detail-header">
                    <div>
                        <p class="section-kicker">RETURN DETAILS</p>
                        <template if:true={selectedReturn}>
                            <div class="detail-title-row">
                                <h2>{selectedReturn.returnNumber}</h2>
                                <span class={selectedReturn.statusClass}>{selectedReturn.status}</span>
                            </div>
                        </template>
                    </div>
                    <button class="close-button" type="button" onclick={closeDetail} aria-label="Close">×</button>
                </div>

                <template if:true={isDetailLoading}>
                    <div class="detail-loading">
                        <lightning-spinner alternative-text="Loading return details" size="small"></lightning-spinner>
                        <span>Loading return details...</span>
                    </div>
                </template>

                <template if:true={detailError}>
                    <div class="message error" role="alert">{detailError}</div>
                </template>

                <template if:true={selectedReturn}>
                    <div class="detail-summary">
                        <div>
                            <span class="meta-label">Order</span>
                            <strong>#{selectedReturn.orderNumber}</strong>
                        </div>
                        <div>
                            <span class="meta-label">Requested</span>
                            <strong>{selectedReturn.createdDate}</strong>
                        </div>
                        <div>
                            <span class="meta-label">Resolution</span>
                            <strong>{selectedReturn.resolutionLabel}</strong>
                        </div>
                        <div>
                            <span class="meta-label">Return amount</span>
                            <strong>
                                <lightning-formatted-number
                                    value={selectedReturn.amountLabel}
                                    format-style="currency"
                                    currency-code="INR"
                                    maximum-fraction-digits="0">
                                </lightning-formatted-number>
                            </strong>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>Returned items</h3>
                        <template if:true={hasDetailLines}>
                            <div class="line-table">
                                <div class="line-row line-header">
                                    <span>Product</span>
                                    <span>Quantity</span>
                                    <span>Unit price</span>
                                    <span>Amount</span>
                                </div>
                                <template for:each={selectedReturn.lines} for:item="line">
                                    <div class="line-row" key={line.id}>
                                        <span>{line.productName}</span>
                                        <span>{line.quantityLabel}</span>
                                        <span>
                                            <lightning-formatted-number
                                                value={line.unitPriceLabel}
                                                format-style="currency"
                                                currency-code="INR"
                                                maximum-fraction-digits="0">
                                            </lightning-formatted-number>
                                        </span>
                                        <span>
                                            <lightning-formatted-number
                                                value={line.lineAmountLabel}
                                                format-style="currency"
                                                currency-code="INR"
                                                maximum-fraction-digits="0">
                                            </lightning-formatted-number>
                                        </span>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <div class="detail-grid">
                        <div>
                            <span class="meta-label">Reason</span>
                            <p>{selectedReturn.reason}</p>
                        </div>
                        <div>
                            <span class="meta-label">Processing step</span>
                            <p>{selectedReturn.currentStep}</p>
                        </div>
                    </div>

                    <template if:true={selectedReturn.creditMemoId}>
                        <div class="integration-note">
                            <span class="meta-label">Credit memo</span>
                            <strong>QuickBooks ID {selectedReturn.creditMemoId}</strong>
                        </div>
                    </template>
                </template>
            </div>
        </section>
    </template>
</template>
