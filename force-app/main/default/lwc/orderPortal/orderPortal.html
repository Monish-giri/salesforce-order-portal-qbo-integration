<template>
    <div class="portal-app">
        <header class="portal-header">
            <div class="brand-block">
                <div class="brand-mark" aria-hidden="true">
                    <lightning-icon icon-name="utility:cart" size="small" alternative-text=""></lightning-icon>
                </div>
                <div>
                    <p class="brand-name">ORDER PORTAL</p>
                    <p class="brand-subtitle">Smart ordering, made simple.</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="cart-button" type="button" title="Shopping cart" onclick={openCart}>
                    <lightning-icon icon-name="utility:cart" size="x-small" alternative-text="Cart"></lightning-icon>
                    <span>Cart</span>
                    <span class="cart-count">{cartCount}</span>
                </button>
                <div class="profile-block">
                    <div class="avatar" aria-hidden="true">
                        <lightning-icon icon-name="utility:user" size="x-small" alternative-text=""></lightning-icon>
                    </div>
                    <div class="profile-copy">
                        <span class="profile-name">{userName}</span>
                        <span class="profile-label">Portal account</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="portal-body">
            <aside class="sidebar">
                <div class="sidebar-heading">Workspace</div>
                <nav aria-label="Portal navigation">
                    <button class={catalogNavClass} type="button" data-section="catalog" onclick={handleNavigation}>
                        <lightning-icon icon-name="utility:product" size="x-small" alternative-text=""></lightning-icon>
                        <span>Catalog</span>
                    </button>
                    <template if:true={isPartner}>
                        <button class={bulkOrderNavClass} type="button" data-section="bulkOrder" onclick={handleNavigation}>
                            <lightning-icon icon-name="utility:upload" size="x-small" alternative-text=""></lightning-icon>
                            <span>Bulk Order</span>
                        </button>
                    </template>
                    <button class="nav-item" type="button" onclick={openCart}>
                        <lightning-icon icon-name="utility:cart" size="x-small" alternative-text=""></lightning-icon>
                        <span>Cart</span>
                        <span class="nav-count">{cartCount}</span>
                    </button>
                    <button class={ordersNavClass} type="button" data-section="orders" onclick={handleNavigation}>
                        <lightning-icon icon-name="utility:orders" size="x-small" alternative-text=""></lightning-icon>
                        <span>My Orders</span>
                    </button>
                    <button class={returnsNavClass} type="button" data-section="returns" onclick={handleNavigation}>
                        <lightning-icon icon-name="utility:replace" size="x-small" alternative-text=""></lightning-icon>
                        <span>Returns</span>
                    </button>
                </nav>
                <div class="sidebar-footer">
                    <div class="status-dot"></div>
                    <div>
                        <span class="status-title">Portal Online</span>
                        <span class="status-copy">Secure Salesforce session</span>
                    </div>
                </div>
            </aside>

            <main class="content-area">
                <template if:true={isCatalog}>
                    <section class="welcome-banner">
                        <div>
                            <p class="section-kicker">YOUR ORDERING HUB</p>
                            <h1>Everything you need, in one place.</h1>
                            <p>Browse available products, build your cart, and manage your orders from a single portal.</p>
                        </div>
                        <div class="banner-accent" aria-hidden="true">
                            <span class="accent-ring ring-one"></span>
                            <span class="accent-ring ring-two"></span>
                            <span class="accent-icon">
                                <lightning-icon icon-name="utility:shopping_bag" size="medium" alternative-text=""></lightning-icon>
                            </span>
                        </div>
                    </section>
                    <c-portal-catalog
                        cart-items={cartItems}
                        oncartquantitychange={handleCartQuantityChange}>
                    </c-portal-catalog>
                </template>

                <template if:true={isBulkOrder}>
                    <c-portal-bulk-order
                        cart-items={cartItems}
                        oncartquantitychange={handleCartQuantityChange}>
                    </c-portal-bulk-order>
                </template>

                <template if:true={isCart}>
                    <section class="cart-view">
                        <div class="view-heading">
                            <div>
                                <p class="section-kicker">YOUR CART</p>
                                <h1>Review your selections</h1>
                                <p>Adjust quantities before we move to checkout.</p>
                            </div>
                            <button class="back-button" type="button" onclick={showCatalog}>Continue Shopping</button>
                        </div>

                        <template if:true={hasCartItems}>
                            <div class="cart-layout">
                                <div class="cart-list">
                                    <template for:each={cartItems} for:item="item">
                                        <article class="cart-item" key={item.pricebookEntryId}>
                                            <div class="cart-item-icon">
                                                <lightning-icon icon-name="standard:product" size="small" alternative-text=""></lightning-icon>
                                            </div>
                                            <div class="cart-item-info">
                                                <h2>{item.name}</h2>
                                                <p>Unit price</p>
                                                <lightning-formatted-number value={item.unitPrice} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number>
                                            </div>
                                            <div class="quantity-control">
                                                <button type="button" data-id={item.pricebookEntryId} onclick={decreaseQuantity} title="Decrease quantity">−</button>
                                                <span>{item.quantity}</span>
                                                <button type="button" data-id={item.pricebookEntryId} onclick={increaseQuantity} title="Increase quantity">+</button>
                                            </div>
                                            <div class="line-total">
                                                <span>Total</span>
                                                <lightning-formatted-number value={item.lineTotal} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number>
                                            </div>
                                            <button class="remove-button" type="button" data-id={item.pricebookEntryId} onclick={removeItem} title="Remove product">
                                                <lightning-icon icon-name="utility:delete" size="x-small" alternative-text="Remove"></lightning-icon>
                                            </button>
                                        </article>
                                    </template>
                                </div>

                                <aside class="cart-summary">
                                    <p class="summary-label">ORDER SUMMARY</p>
                                    <div class="summary-row">
                                        <span>Items</span>
                                        <span>{cartCount}</span>
                                    </div>
                                    <div class="summary-divider"></div>
                                    <div class="summary-total">
                                        <span>Subtotal</span>
                                        <lightning-formatted-number value={cartSubtotal} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number>
                                    </div>
                                    <button class="checkout-button" type="button" onclick={openCheckout}>Proceed to Checkout</button>
                                    <p class="checkout-note">Review the order and customer account before submitting.</p>
                                </aside>
                            </div>
                        </template>

                        <template if:false={hasCartItems}>
                            <div class="empty-cart">
                                <div class="empty-cart-icon">
                                    <lightning-icon icon-name="utility:cart" size="medium" alternative-text=""></lightning-icon>
                                </div>
                                <h2>Your cart is empty</h2>
                                <p>Add products from the catalog to start an order.</p>
                                <button class="back-button primary" type="button" onclick={showCatalog}>Browse Catalog</button>
                            </div>
                        </template>
                    </section>
                </template>

                <template if:true={isCheckout}>
                    <c-portal-checkout
                        cart-items={cartItems}
                        onordersubmitted={handleOrderSubmitted}
                        onbacktocart={handleCheckoutBack}>
                    </c-portal-checkout>
                </template>

                <template if:true={isOrderConfirmation}>
                    <section class="order-confirmation">
                        <div class="confirmation-icon">
                            <lightning-icon icon-name="utility:success" size="medium" alternative-text=""></lightning-icon>
                        </div>
                        <p class="section-kicker">ORDER CONFIRMED</p>
                        <h1>Order #{orderConfirmation.orderNumber}</h1>
                        <p>Your order for <strong>{orderConfirmation.accountName}</strong> has been created in Salesforce.</p>
                        <div class="confirmation-total">
                            <span>Order total</span>
                            <lightning-formatted-number
                                value={orderConfirmation.totalAmount}
                                format-style="currency"
                                currency-code="INR"
                                maximum-fraction-digits="0">
                            </lightning-formatted-number>
                        </div>
                        <p class="confirmation-note">QuickBooks invoicing will be connected in the next integration phase.</p>
                        <button class="back-button primary" type="button" onclick={showCatalog}>Back to Catalog</button>
                    </section>
                </template>

                <template if:true={isOrders}>
                    <c-portal-orders></c-portal-orders>
                </template>

                <template if:true={isReturns}>
                    <c-portal-returns></c-portal-returns>
                </template>

                <template if:true={isComingSoon}>
                    <section class="coming-soon">
                        <div class="coming-icon">
                            <lightning-icon icon-name="utility:construction" size="medium" alternative-text=""></lightning-icon>
                        </div>
                        <p class="section-kicker">COMING NEXT</p>
                        <h1>{sectionTitle}</h1>
                        <p>This section will be connected to the portal flow next.</p>
                        <button class="back-button" type="button" onclick={showCatalog}>Back to Catalog</button>
                    </section>
                </template>
            </main>
        </div>
    </div>
</template>
