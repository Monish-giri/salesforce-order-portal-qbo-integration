<template>
    <section class="catalog-section">
        <div class="catalog-heading">
            <div>
                <p class="eyebrow">{audience} CATALOG</p>
                <h2>{catalogTitle}</h2>
                <p class="subtitle">{catalogSubtitle}</p>
            </div>
            <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;justify-content:flex-end;">
                <template if:true={isPartner}>
                    <button
                        type="button"
                        onclick={openQuickOrder}
                        style="display:inline-flex;align-items:center;gap:0.45rem;padding:0.55rem 0.8rem;border:1px solid #0b5cab;border-radius:0.6rem;background:#ffffff;color:#0b5cab;font-size:0.68rem;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(16,24,40,0.06);"
                        title="Create a bulk order using product codes and quantities">
                        <lightning-icon icon-name="utility:upload" size="xx-small" alternative-text=""></lightning-icon>
                        <span>Quick Order / CSV</span>
                    </button>
                </template>
                <div class="result-badge">
                    <span>{products.length}</span>
                    <span>available</span>
                </div>
            </div>
        </div>

        <div class="search-panel">
            <lightning-input
                type="search"
                variant="label-hidden"
                label="Search products"
                placeholder="Search by product name or code..."
                value={searchTerm}
                onchange={handleSearchInput}
                class="search-input">
            </lightning-input>
        </div>

        <template if:true={isLoading}>
            <div class="state-panel">
                <lightning-spinner alternative-text="Loading products" size="medium"></lightning-spinner>
                <p>Loading catalog...</p>
            </div>
        </template>

        <template if:true={errorMessage}>
            <div class="state-panel error-panel" role="alert">
                <lightning-icon icon-name="utility:error" size="small" alternative-text="Error"></lightning-icon>
                <div>
                    <h2>We couldn't load the catalog</h2>
                    <p>{errorMessage}</p>
                    <lightning-button label="Try Again" variant="brand" onclick={loadProducts}></lightning-button>
                </div>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:false={errorMessage}>
                <template if:true={hasProducts}>
                    <div class="catalog-grid" style="grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));">
                        <template for:each={products} for:item="product">
                            <article class="product-card" key={product.pricebookEntryId}>
                                <div class="product-visual">
                                    <div class="product-icon">
                                        <lightning-icon icon-name="standard:product" size="medium" alternative-text=""></lightning-icon>
                                    </div>
                                    <template if:true={product.family}>
                                        <span class="product-family">{product.family}</span>
                                    </template>
                                </div>

                                <div
                                    class="product-content"
                                    data-id={product.pricebookEntryId}
                                    onmouseenter={handleProductMouseEnter}
                                    onmouseleave={handleProductMouseLeave}>
                                    <h3
                                        class="product-name"
                                        title={product.name}
                                        data-id={product.pricebookEntryId}
                                        onclick={handleOpenImageModal}>
                                        {product.name}
                                    </h3>

                                    <template if:true={product.hasImages}>
                                        <template if:true={product.isImagePreviewVisible}>
                                            <div
                                                class="image-preview"
                                                style={product.previewStyle}
                                                role="button"
                                                tabindex="0"
                                                title="Click to view product images"
                                                onclick={handleOpenImageModal}>
                                                <img
                                                    src={product.currentImageUrl}
                                                    alt={product.name}
                                                    class={product.previewImageClass} />
                                                <button
                                                    class="preview-nav preview-prev"
                                                    type="button"
                                                    title="Previous image"
                                                    aria-label="Previous image"
                                                    data-id={product.pricebookEntryId}
                                                    onclick={handlePreviousHoverImage}>
                                                    ‹
                                                </button>
                                                <button
                                                    class="preview-nav preview-next"
                                                    type="button"
                                                    title="Next image"
                                                    aria-label="Next image"
                                                    data-id={product.pricebookEntryId}
                                                    onclick={handleNextHoverImage}>
                                                    ›
                                                </button>
                                            </div>
                                        </template>
                                    </template>

                                    <template if:true={product.productCode}>
                                        <p class="product-code">{product.productCode}</p>
                                    </template>
                                    <template if:true={product.description}>
                                        <p class="product-description">{product.description}</p>
                                    </template>
                                </div>

                                <div class="product-footer">
                                    <div class="pricing-stack">
                                        <div class="primary-price">
                                            <span class="price-label">{isPartner ? 'Partner price' : 'Starting at'}</span>
                                            <lightning-formatted-number
                                                class="price"
                                                value={product.unitPrice}
                                                format-style="currency"
                                                currency-code="INR"
                                                maximum-fraction-digits="0">
                                            </lightning-formatted-number>
                                        </div>
                                    </div>

                                    <template if:false={product.isProceedToCart}>
                                        <lightning-button
                                            label="Add to cart"
                                            variant="brand"
                                            data-id={product.pricebookEntryId}
                                            onclick={handleAddToCart}>
                                        </lightning-button>
                                    </template>

                                    <template if:true={product.isProceedToCart}>
                                        <div class="quantity-panel" style="grid-column: 2;">
                                            <div class="quantity-controls" aria-label="Product quantity control">
                                                <button
                                                    class="quantity-button"
                                                    type="button"
                                                    data-id={product.pricebookEntryId}
                                                    onclick={handleDecreaseQuantity}
                                                    title={product.quantityDecreaseTitle}
                                                    aria-label={product.quantityDecreaseLabel}>
                                                    <template if:true={product.isSingleQuantity}>
                                                        <lightning-icon icon-name="utility:delete" size="xx-small" alternative-text="Remove"></lightning-icon>
                                                    </template>
                                                    <template if:false={product.isSingleQuantity}>
                                                        −
                                                    </template>
                                                </button>

                                                <input
                                                    class="quantity-input"
                                                    type="number"
                                                    min="1"
                                                    step="1"
                                                    value={product.cartQuantity}
                                                    data-id={product.pricebookEntryId}
                                                    aria-label="Quantity"
                                                    onchange={handleQuantityInput} />

                                                <button
                                                    class="quantity-button"
                                                    type="button"
                                                    title="Increase quantity"
                                                    aria-label="Increase quantity"
                                                    data-id={product.pricebookEntryId}
                                                    onclick={handleIncreaseQuantity}>
                                                    +
                                                </button>

                                                <span class="slds-assistive-text" aria-live="polite">
                                                    In cart: {product.cartQuantity}
                                                </span>
                                            </div>

                                            <lightning-button
                                                class="confirm-cart-button"
                                                label="Proceed to cart"
                                                variant="brand"
                                                onclick={handleProceedToCart}>
                                            </lightning-button>
                                        </div>
                                    </template>
                                </div>
                            </article>
                        </template>
                    </div>
                </template>

                <template if:false={hasProducts}>
                    <div class="state-panel empty-panel">
                        <lightning-icon icon-name="utility:search" size="medium" alternative-text=""></lightning-icon>
                        <h2>No products found</h2>
                        <p>Try a different search term or check back later.</p>
                    </div>
                </template>
            </template>
        </template>
    </section>

    <template if:true={showQuickOrder}>
        <section role="dialog" aria-modal="true" aria-labelledby="quick-order-title" style="position:fixed;z-index:2000;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:rgba(15,23,42,0.68);backdrop-filter:blur(4px);">
            <div style="width:min(92vw,56rem);max-height:90vh;overflow:auto;border:1px solid #dbe4ee;border-radius:1.25rem;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,0.28);">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.35rem 1.5rem;border-bottom:1px solid #e4e7ec;">
                    <div>
                        <p class="eyebrow">PARTNER BULK ORDERING</p>
                        <h2 id="quick-order-title" style="margin:0;color:#172033;font-size:1.35rem;">Quick Order / CSV Order</h2>
                        <p style="margin:0.35rem 0 0;color:#667085;font-size:0.78rem;">Enter product codes and quantities to build your cart in one step. No customer account selection is required.</p>
                    </div>
                    <button type="button" onclick={closeQuickOrder} disabled={isBulkLoading} aria-label="Close" title="Close" style="display:grid;width:2.5rem;height:2.5rem;place-items:center;border:1px solid #d0d5dd;border-radius:50%;background:#fff;color:#344054;cursor:pointer;font-size:1.4rem;">×</button>
                </div>
                <div style="padding:1.5rem;">
                    <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:end;">
                        <div>
                            <p style="margin:0 0 0.35rem;color:#344054;font-size:0.72rem;font-weight:800;">CSV / SHEET FORMAT</p>
                            <p style="margin:0;color:#667085;font-size:0.72rem;line-height:1.5;">Use two columns: <strong>Product Code</strong> and <strong>Quantity</strong>. Excel or Google Sheets can be exported as CSV.</p>
                        </div>
                        <button type="button" onclick={downloadBulkTemplate} style="padding:0.55rem 0.8rem;border:1px solid #cbd5e1;border-radius:0.55rem;background:#fff;color:#344054;font-size:0.7rem;font-weight:800;cursor:pointer;white-space:nowrap;">Download Template</button>
                    </div>
                    <div style="margin-top:1rem;padding:1rem;border:1px solid #dbe4ee;border-radius:0.8rem;background:#f8fafc;">
                        <lightning-input type="file" label="Upload CSV" accept=".csv,.txt" onchange={handleBulkFileChange} disabled={isBulkLoading}></lightning-input>
                        <p style="margin:0.45rem 0 0;color:#98a2b3;font-size:0.65rem;">Or paste directly below. Tab-separated spreadsheet rows are also supported.</p>
                    </div>
                    <div style="margin-top:1rem;">
                        <lightning-textarea label="Order lines" value={bulkInput} onchange={handleBulkInput} disabled={isBulkLoading} rows="9" placeholder="Product Code,Quantity\nGC1020,25\nIN7020,10"></lightning-textarea>
                    </div>
                    <template if:true={bulkErrorMessage}>
                        <div role="alert" style="margin-top:1rem;padding:0.8rem 0.95rem;border:1px solid #fecdca;border-radius:0.65rem;background:#fff6f5;color:#b42318;font-size:0.72rem;">
                            <strong>{bulkErrorMessage}</strong>
                            <template if:true={bulkMissingCodes.length}><div style="margin-top:0.35rem;">Missing product codes: {bulkMissingCodes}</div></template>
                        </div>
                    </template>
                    <div style="display:flex;justify-content:flex-end;gap:0.65rem;margin-top:1.25rem;">
                        <button type="button" onclick={closeQuickOrder} disabled={isBulkLoading} style="padding:0.65rem 1rem;border:1px solid #cbd5e1;border-radius:0.6rem;background:#fff;color:#344054;font-size:0.72rem;font-weight:800;cursor:pointer;">Cancel</button>
                        <button type="button" onclick={applyQuickOrder} disabled={isBulkLoading} style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.65rem 1.05rem;border:1px solid #0b5cab;border-radius:0.6rem;background:#0b5cab;color:#fff;font-size:0.72rem;font-weight:800;cursor:pointer;">
                            <template if:true={isBulkLoading}><lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner></template>
                            <span>{isBulkLoading ? 'Building Cart...' : 'Add Bulk Order to Cart'}</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </template>

    <template if:true={selectedImageProduct}>
        <section class="image-modal-backdrop" role="dialog" aria-modal="true" aria-label="Product images" onclick={handleCloseImageModal}>
            <div class="image-modal" onclick={handleModalContentClick}>
                <div class="image-modal-header">
                    <div>
                        <p class="eyebrow">PRODUCT IMAGES</p>
                        <h2>{selectedImageProduct.name}</h2>
                    </div>
                    <button class="modal-close" type="button" title="Close" aria-label="Close" onclick={handleCloseImageModal}>×</button>
                </div>
                <div class="modal-image-container" ontouchstart={handleImageTouchStart} ontouchend={handleImageTouchEnd}>
                    <img src={selectedImageUrl} alt={selectedImageProduct.name} class="modal-image" />
                    <button class="modal-nav modal-prev" type="button" title="Previous image" aria-label="Previous image" onclick={handlePreviousModalImage}>‹</button>
                    <button class="modal-nav modal-next" type="button" title="Next image" aria-label="Next image" onclick={handleNextModalImage}>›</button>
                </div>
                <div class="image-counter">{selectedImageCounter}</div>
            </div>
        </section>
    </template>
</template>
