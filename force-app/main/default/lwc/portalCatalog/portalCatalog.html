<template>
    <section class="catalog-section">
        <div class="catalog-heading">
            <div>
                <p class="eyebrow">{audience} CATALOG</p>
                <h2>{catalogTitle}</h2>
                <p class="subtitle">{catalogSubtitle}</p>
            </div>
            <div class="result-badge">
                <span>{products.length}</span>
                <span>available</span>
            </div>
        </div>

        <div class="search-panel">
            <lightning-input
                type="search"
                variant="label-hidden"
                label="Search products"
                placeholder="Search by product name or code..."
                value={searchTerm}
                onchange={handleSearchInput}
                class="search-input">
            </lightning-input>
        </div>

        <template if:true={isLoading}>
            <div class="state-panel">
                <lightning-spinner alternative-text="Loading products" size="medium"></lightning-spinner>
                <p>Loading catalog...</p>
            </div>
        </template>

        <template if:true={errorMessage}>
            <div class="state-panel error-panel" role="alert">
                <lightning-icon icon-name="utility:error" size="small" alternative-text="Error"></lightning-icon>
                <div>
                    <h2>We couldn't load the catalog</h2>
                    <p>{errorMessage}</p>
                    <lightning-button label="Try Again" variant="brand" onclick={loadProducts}></lightning-button>
                </div>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:false={errorMessage}>
                <template if:true={hasProducts}>
                    <div class="catalog-grid">
                        <template for:each={products} for:item="product">
                            <article class="product-card" key={product.pricebookEntryId}>
                                <div class="product-visual">
                                    <template if:true={product.hasImages}>
                                        <div class="product-image-badge">
                                            <lightning-icon icon-name="utility:image" size="xx-small" alternative-text="Product images"></lightning-icon>
                                            <span>{product.imageCount}</span>
                                        </div>
                                    </template>
                                    <template if:false={product.hasImages}>
                                        <div class="product-icon">
                                            <lightning-icon icon-name="standard:product" size="medium" alternative-text=""></lightning-icon>
                                        </div>
                                    </template>
                                    <template if:true={product.family}>
                                        <span class="product-family">{product.family}</span>
                                    </template>
                                </div>

                                <div class="product-content">
                                    <div
                                        class="product-name-wrap"
                                        onmouseenter={handleProductNameEnter}
                                        onmouseleave={handleProductNameLeave}>
                                        <button
                                            class="product-name-button"
                                            type="button"
                                            data-id={product.pricebookEntryId}
                                            aria-label={product.name}
                                            onclick={handleOpenGallery}>
                                            <h3>{product.name}</h3>
                                        </button>

                                        <template if:true={product.isImageHovering}>
                                            <div class="hover-gallery" role="dialog" aria-label="Product image preview">
                                                <img
                                                    src={product.hoverImageUrl}
                                                    alt={product.name} />
                                                <div class="hover-gallery-footer">
                                                    <span>{product.hoverImageCounter}</span>
                                                    <span>Click to view</span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <template if:true={product.productCode}>
                                        <p class="product-code">{product.productCode}</p>
                                    </template>
                                    <template if:true={product.description}>
                                        <p class="product-description">{product.description}</p>
                                    </template>
                                </div>

                                <div class="product-footer">
                                    <div class="pricing-stack">
                                        <div class="primary-price">
                                            <span class="price-label">{isPartner ? 'Partner price' : 'Starting at'}</span>
                                            <lightning-formatted-number
                                                class="price"
                                                value={product.unitPrice}
                                                format-style="currency"
                                                currency-code="INR"
                                                maximum-fraction-digits="0">
                                            </lightning-formatted-number>
                                        </div>
                                    </div>

                                    <template if:false={product.isSelectingQuantity}>
                                        <lightning-button
                                            label="Add to cart"
                                            variant="brand"
                                            data-id={product.pricebookEntryId}
                                            onclick={handleAddToCart}>
                                        </lightning-button>
                                    </template>

                                    <template if:true={product.isSelectingQuantity}>
                                        <div class="quantity-panel">
                                            <label class="quantity-label" for={product.quantityInputId}>Quantity</label>
                                            <div class="quantity-controls">
                                                <button
                                                    class="quantity-button"
                                                    type="button"
                                                    title="Decrease quantity"
                                                    aria-label="Decrease quantity"
                                                    data-id={product.pricebookEntryId}
                                                    onclick={handleDecreaseQuantity}>
                                                    −
                                                </button>
                                                <input
                                                    class="quantity-input"
                                                    type="number"
                                                    min="1"
                                                    step="1"
                                                    value={product.selectedQuantity}
                                                    data-id={product.pricebookEntryId}
                                                    aria-label="Quantity"
                                                    onchange={handleQuantityInput} />
                                                <button
                                                    class="quantity-button"
                                                    type="button"
                                                    title="Increase quantity"
                                                    aria-label="Increase quantity"
                                                    data-id={product.pricebookEntryId}
                                                    onclick={handleIncreaseQuantity}>
                                                    +
                                                </button>
                                            </div>
                                            <lightning-button
                                                class="confirm-cart-button"
                                                label="Add to cart"
                                                variant="brand"
                                                data-id={product.pricebookEntryId}
                                                onclick={handleConfirmAddToCart}>
                                            </lightning-button>
                                        </div>
                                    </template>
                                </div>
                            </article>
                        </template>
                    </div>
                </template>

                <template if:false={hasProducts}>
                    <div class="state-panel empty-panel">
                        <lightning-icon icon-name="utility:search" size="medium" alternative-text=""></lightning-icon>
                        <h2>No products found</h2>
                        <p>Try a different search term or check back later.</p>
                    </div>
                </template>
            </template>
        </template>
    </section>

    <template if:true={isGalleryOpen}>
        <section
            class="gallery-backdrop"
            role="dialog"
            aria-modal="true"
            aria-label={galleryProduct.name}
            onclick={handleGalleryBackdropClick}
            onkeydown={handleGalleryKeydown}
            tabindex="-1">
            <div class="gallery-modal">
                <header class="gallery-header">
                    <div>
                        <p class="eyebrow">PRODUCT IMAGES</p>
                        <h2>{galleryProduct.name}</h2>
                    </div>
                    <button
                        class="gallery-close"
                        type="button"
                        title="Close gallery"
                        aria-label="Close gallery"
                        onclick={closeGallery}>
                        ×
                    </button>
                </header>

                <div
                    class="gallery-stage"
                    ontouchstart={handleGalleryTouchStart}
                    ontouchend={handleGalleryTouchEnd}>
                    <img src={galleryImageUrl} alt={galleryProduct.name} />

                    <template if:true={galleryHasMultipleImages}>
                        <button
                            class="gallery-nav previous"
                            type="button"
                            title="Previous image"
                            aria-label="Previous image"
                            onclick={handleGalleryPrevious}>
                            ‹
                        </button>
                        <button
                            class="gallery-nav next"
                            type="button"
                            title="Next image"
                            aria-label="Next image"
                            onclick={handleGalleryNext}>
                            ›
                        </button>
                    </template>
                </div>

                <div class="gallery-footer">
                    <span>{galleryCounter}</span>
                    <template if:true={galleryHasMultipleImages}>
                        <span>Swipe or use the arrows to browse</span>
                    </template>
                </div>
            </div>
        </section>
    </template>
</template>
