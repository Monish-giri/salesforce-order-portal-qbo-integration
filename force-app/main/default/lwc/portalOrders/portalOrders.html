<template>
    <section class="orders-page">
        <div class="view-heading">
            <div>
                <p class="section-kicker">ORDER HISTORY</p>
                <h1>My Orders</h1>
                <p>View orders available to your portal account.</p>
            </div>
        </div>

        <template if:true={errorMessage}>
            <div class="message error">{errorMessage}</div>
        </template>

        <template if:true={isLoading}>
            <div class="loading-state">
                <lightning-spinner alternative-text="Loading orders" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={showList}>
            <div class="order-list">
                <template for:each={orders} for:item="order">
                    <button class="order-card" type="button" key={order.id} data-id={order.id} onclick={handleOrderClick}>
                        <div class="order-card-main">
                            <span class="order-number">Order #{order.orderNumber}</span>
                            <span class="order-account">{order.accountName}</span>
                        </div>
                        <div class="order-card-meta">
                            <span>{order.status}</span>
                            <span>{order.effectiveDate}</span>
                            <lightning-formatted-number value={order.totalAmount} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number>
                        </div>
                    </button>
                </template>
            </div>
        </template>

        <template if:true={showEmpty}>
            <div class="empty-state">
                <lightning-icon icon-name="utility:orders" size="medium" alternative-text=""></lightning-icon>
                <h2>No orders yet</h2>
                <p>Your submitted orders will appear here.</p>
            </div>
        </template>

        <template if:true={showDetail}>
            <article class="order-detail-card">
                <div class="detail-header">
                    <div>
                        <p class="section-kicker">ORDER DETAILS</p>
                        <h2>Order #{selectedOrder.orderNumber}</h2>
                        <p>{selectedOrder.accountName}</p>
                    </div>
                    <button class="back-button" type="button" onclick={backToList}>Back to Orders</button>
                </div>

                <div class="detail-summary">
                    <div><span>Status</span><strong>{selectedOrder.status}</strong></div>
                    <div><span>Order Date</span><strong>{selectedOrder.effectiveDate}</strong></div>
                    <div>
                        <span>Total</span>
                        <strong><lightning-formatted-number value={selectedOrder.totalAmount} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number></strong>
                    </div>
                </div>

                <template if:true={isB2BInvoice}>
                    <section class="invoice-panel">
                        <div class="panel-header">
                            <div>
                                <p class="section-kicker">PAYMENT &amp; INVOICE</p>
                                <h3>B2B Invoice / Credit Terms</h3>
                                <p>Pay within the applicable window to receive the configured early-payment discount.</p>
                            </div>
                            <span class="invoice-badge">B2B INVOICE</span>
                        </div>

                        <div class="invoice-grid">
                            <div><span>Invoice Status</span><strong>{selectedOrder.invoiceStatus}</strong></div>
                            <div><span>Payment Status</span><strong>{selectedOrder.paymentStatus}</strong></div>
                            <div><span>Invoice Number</span><strong>{selectedOrder.qboInvoiceNumber}</strong></div>
                            <div><span>Issue Date</span><strong>{selectedOrder.invoiceIssueDate}</strong></div>
                            <div><span>Due Date</span><strong>{selectedOrder.invoiceDueDate}</strong></div>
                            <template if:true={hasInvoiceBalance}>
                                <div>
                                    <span>Outstanding Balance</span>
                                    <strong><lightning-formatted-number value={selectedOrder.invoiceBalance} format-style="currency" currency-code="INR" maximum-fraction-digits="2"></lightning-formatted-number></strong>
                                </div>
                            </template>
                        </div>

                        <div class="discount-panel">
                            <div class="discount-title">
                                <div>
                                    <span class="section-kicker">EARLY PAYMENT DISCOUNT</span>
                                    <h3>Save by paying early</h3>
                                </div>
                                <template if:true={hasCurrentDiscount}>
                                    <span class="discount-badge">{currentDiscountLabel}</span>
                                </template>
                            </div>

                            <template if:true={hasCurrentDiscount}>
                                <div class="discount-current">
                                    <div><span>Current offer</span><strong>{currentDiscountMessage}</strong></div>
                                    <div><span>Discount</span><strong>{currentDiscountPercent}%</strong></div>
                                    <div>
                                        <span>You save</span>
                                        <strong><lightning-formatted-number value={selectedOrder.currentDiscount.discountAmount} format-style="currency" currency-code="INR" maximum-fraction-digits="2"></lightning-formatted-number></strong>
                                    </div>
                                    <div>
                                        <span>Payable now</span>
                                        <strong><lightning-formatted-number value={selectedOrder.currentDiscount.payableAmount} format-style="currency" currency-code="INR" maximum-fraction-digits="2"></lightning-formatted-number></strong>
                                    </div>
                                </div>
                            </template>
                            <template if:false={hasCurrentDiscount}>
                                <p class="discount-pending">The invoice dates or balance are not available yet. The discount schedule will appear below once the invoice is available.</p>
                            </template>

                            <div class="discount-schedule">
                                <div class="schedule-heading"><span>Payment window</span><span>Discount</span></div>
                                <template for:each={selectedOrder.discountSchedule} for:item="rule">
                                    <div class="schedule-row" key={rule.dayFrom}>
                                        <span>{rule.rangeLabel}</span>
                                        <strong>{rule.discountPercent}%</strong>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </section>
                </template>

                <template if:false={isB2BInvoice}>
                    <section class="payment-panel">
                        <p class="section-kicker">PAYMENT</p>
                        <h3>{paymentMethodLabel}</h3>
                        <div class="payment-status-row">
                            <span>Payment Status</span>
                            <strong>{selectedOrder.paymentStatus}</strong>
                        </div>
                    </section>
                </template>

                <div class="line-list">
                    <div class="line-heading"><span>Product</span><span>Quantity</span><span>Unit Price</span><span>Total</span></div>
                    <template for:each={selectedOrder.lines} for:item="line">
                        <div class="line-row" key={line.id}>
                            <span>{line.productName}</span>
                            <span>{line.quantity}</span>
                            <lightning-formatted-number value={line.unitPrice} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number>
                            <lightning-formatted-number value={line.totalPrice} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number>
                        </div>
                    </template>
                </div>
            </article>
        </template>
    </section>
</template>
